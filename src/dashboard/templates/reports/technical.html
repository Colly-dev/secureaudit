<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Technical Audit Report - SecureAudit</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; line-height: 1.4; color: #333; padding: 20px; }
        .finding { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-left: 5px solid #333; }
        .severity-critical { border-left-color: #d32f2f; }
        .severity-high { border-left-color: #f57c00; }
        .severity-medium { border-left-color: #fbc02d; }
        .severity-low { border-left-color: #388e3c; }
        .severity-info { border-left-color: #1976d2; }
        .label { font-weight: bold; min-width: 120px; display: inline-block; }
    </style>
</head>
<body>
    <h1>SecureAudit: Technical Report</h1>
    <p>Target: {{ audit.target }}</p>
    <hr>

    {% for finding in audit.findings %}
    <div class="finding severity-{{ finding.severity.lower() }}">
        <p><span class="label">ID:</span> {{ finding.id }}</p>
        <p><span class="label">Title:</span> {{ finding.title }}</p>
        <p><span class="label">Severity:</span> {{ finding.severity }}</p>
        <p><span class="label">Category:</span> {{ finding.category }}</p>
        <p><span class="label">Description:</span> {{ finding.description }}</p>
    </div>
    {% endfor %}
</body>
</html>
