# ⚠️ ETHICAL USE WARNING ⚠️
# This configuration file is part of SecureAudit, a security configuration auditing platform.
# ONLY use this tool to audit systems, websites, and cloud accounts you own or have explicit written authorization to assess.
# Refer to README.md for full ethical guidelines and liability disclaimer.

# --- General Settings ---
app_name: SecureAudit
version: 0.1.0

# --- Database Settings ---
database:
  type: sqlite
  path: ../databases/secureaudit.db
  # For PostgreSQL (optional):
  # type: postgresql
  # host: localhost
  # port: 5432
  # user: secureaudit_user
  # password: secureaudit_password
  # dbname: secureaudit_db

# --- Logging Settings ---
logging:
  level: INFO
  log_dir: ../logs
  audit_log: audit.log
  compliance_log: compliance.log
  cloud_log: cloud.log
  api_log: api.log
  errors_log: errors.log

# --- Reporting Settings ---
reports:
  output_dir: ../reports
  formats: [html, json, csv, pdf]

# --- Web Dashboard Settings ---
web_dashboard:
  host: 0.0.0.0
  port: 5000
  debug: False

# --- AWS Settings (Read-Only) ---
aws:
  region: us-east-1
  # Example: Only allow Describe*, List*, Get* API calls
  allowed_api_actions: ["Describe*", "List*", "Get*"]

# --- Azure Settings (Read-Only) ---
azure:
  tenant_id: ""
  client_id: ""
  client_secret: ""
  subscription_id: ""
  # Example: Only allow read-only operations
  allowed_api_actions: ["read"]

# --- SSH Settings ---
ssh:
  timeout: 10
  port: 22

# --- Network Scan Settings ---
network_scan:
  timeout: 1
  common_ports: [21, 22, 23, 25, 53, 80, 110, 135, 139, 143, 443, 445, 3389, 8080]
  max_concurrency: 10
